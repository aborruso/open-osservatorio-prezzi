[project]
name = "openosservaprezzi"
version = "0.4.0"
description = "CLI read-only per i dati pubblici dell'Osservatorio Prezzi"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Andrea Borruso", email = "aborruso@gmail.com" }]
keywords = ["osservatorio-prezzi", "prezzi", "open-data", "mimit", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "lxml>=5.2",
    "PyYAML>=6.0",
    "portalocker>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/aborruso/open-osservatorio-prezzi"
Source = "https://github.com/aborruso/open-osservatorio-prezzi"
Issues = "https://github.com/aborruso/open-osservatorio-prezzi/issues"
Changelog = "https://github.com/aborruso/open-osservatorio-prezzi/blob/main/CHANGELOG.md"

[project.scripts]
osservaprezzi = "osservaprezzi.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osservaprezzi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
